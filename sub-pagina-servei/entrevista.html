<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrevista</title>
    <link rel="stylesheet" href="../css-carpeta/entrevista.css">
    <link rel="stylesheet" href="../css-carpeta/display.css">
    <link rel="stylesheet" href="../css-carpeta/contenidos-pag/nav-footer.css">

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="display-flex space-bet ali-center">
        <a href=""><img src="../img/index-img/transparent-logo.png" alt="" id="logo"></a>

        <span id="user-info" class="Rubik-F">
            Hola <a href="../sub-pagina/login.html">iniciar sessió</a>!
        </span>

        <div class="display-flex space-bet container-list-button">
            <ul class="display-flex gap-50">
                <li><a href="../index.html">Inici</a></li>
                <li><a href="">Revisar</a></li>
                <li><a href="../sub-pagina-servei/entrevista.html">Entrevista</a></li>
                <li><a href="../sub-pagina-servei/contacte.html">Contacte</a></li>
                <li><a href="../sub-pagina-servei/premium.html">Premium</a></li>
            </ul>

            <div class="display-flex gap-10">
                <button class="but-login"><a href="../sub-pagina/login.html">Iniciar</a></button>
                <button class="but-iniciar"><a href="sub-pagina-servei/crearcv.html">Crear</a></button>
            </div>
        </div>
    </nav>

    <main class="display-flex just-center ali-center column gap-40">
        <div>
            <img src="../img/img-entrevista/tamano-completo.png" alt="" id="completar">
            <div class="Inter-F back-box-entrevista display-flex ali-center just-center">
                <div class="display-flex gap-10">
                    <div class="llama-back display-flex column ali-center gap-10 just-center">
                        <img src="../img/img-entrevista/usuario.png" alt="">
                        <p>Entrevistador</p>
                    </div>
                    <div class="llama-back display-flex column ali-center gap-10 just-center">
                        <img src="../img/img-entrevista/usuario.png" alt="">
                        <p>Usuari (client)</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="info-box-entrevista">
            <div class="menu-infor Rubik-F display-flex column gap-20">
                <div>
                    <p>INTRODUEIX EL CODI</p>
                    <input type="text" class="input-infor">
                </div>
                <div>
                    <p>PIN</p>
                    <input type="password" class="input-infor">
                </div>
                <button class="Inter-F">CONECTAR</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="../auth.js"></script>

    <script>
        async function checkUser() {
            const userInfo = document.getElementById("user-info")

            const user = await getUserProfile()

            if (!user) {
                userInfo.innerHTML = `
                    Hola <a href="../sub-pagina/login.html">iniciar sessió</a>!
                `
                return
            }

            if (!user.username) {
                window.location.href = "../sub-pagina/registrar2.html"
                return
            }

            userInfo.innerHTML = `
                Hola <a href="../sub-pagina/userprofile.html">${user.username}</a>!
            `
        }

        // 👇 SOLO UNA VEZ Y AL FINAL
        checkUser()
    </script>
</body>
</html>
